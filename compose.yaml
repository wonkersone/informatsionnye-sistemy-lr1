services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vehicle_lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - vehicle_lab_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vehicle_lab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vehicle_lab_data:
